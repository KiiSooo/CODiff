name: codiff

channels:
  - conda-forge

dependencies:
  - python=3.8.10
  - pip=24.2

  # Numerical, evaluation, and image-processing dependencies.
  - numpy=1.24.4
  - scipy=1.10.1
  - scikit-learn=1.3.2
  - numba=0.58.1
  - pillow=10.2.0

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - accelerate==1.0.1
      - albumentations==1.4.18
      - cosine-annealing-warmup==2.0
      - einops==0.8.1
      - huggingface-hub==0.24.5
      - matplotlib==3.7.5
      - mmcv==2.1.0
      - mmengine==0.10.7
      - omegaconf==2.3.0
      - opencv-python==4.12.0.88
      - pytorch-msssim==1.0.0
      - timm==0.4.12
      - torch==2.1.0
      - torchvision==0.16.0
      - tqdm==4.65.2
      - wandb==0.23.1
